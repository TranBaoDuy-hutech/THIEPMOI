<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Danh Sách Khách Dự - v4</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.14), transparent 45%),
        radial-gradient(circle at 85% 0%, rgba(168, 85, 247, 0.14), transparent 40%),
        #05070f;
      color: #e5e7eb;
      margin: 0;
      padding: 32px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(17, 24, 39, 0.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 18px;
      padding: 28px 28px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #052e16;
      background: linear-gradient(135deg, #4ade80, #22c55e);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .subtitle {
      color: #64748b;
      font-size: 0.85rem;
      margin-bottom: 22px;
    }

    .status {
      margin: 0 0 20px;
      color: #7dd3fc;
      font-size: 0.88rem;
      padding: 10px 14px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.18);
      border-radius: 10px;
    }

    .login-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 380px;
      margin: 0 auto;
      padding-top: 12px;
    }

    .login-box h1 {
      justify-content: center;
    }

    label.field-label {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: -8px;
    }

    input {
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #263041;
      background: #0c1322;
      color: #f1f5f9;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input::placeholder {
      color: #55627a;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: none;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #04121c;
    }

    .btn-ghost {
      background: rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .btn-danger {
      background: linear-gradient(135deg, #f87171, #ef4444);
      color: #2b0505;
    }

    .btn-danger-outline {
      background: transparent;
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.4);
      margin-left: auto;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    thead tr {
      background: rgba(148, 163, 184, 0.06);
    }

    th {
      color: #7dd3fc;
      text-align: left;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      color: #e2e8f0;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: rgba(148, 163, 184, 0.04);
    }

    .status-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .delete-button {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 12px;
      font-size: 0.78rem;
    }

    .empty {
      color: #64748b;
      padding: 24px 0;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    .ticket-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(8px);
    }

    .ticket-modal.open {
      display: flex;
    }

    .ticket-modal-panel {
      width: min(760px, 100%);
      max-height: 92vh;
      overflow: auto;
      padding: 18px;
      border-radius: 24px;
      background: #0b1220;
      border: 1px solid rgba(200, 164, 93, 0.35);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
    }

    .ticket-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .ticket-modal-title {
      color: #f8fafc;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .ticket-modal-close {
      padding: 7px 11px;
      background: rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .ticket-card-admin {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 128px;
      min-height: 260px;
      overflow: hidden;
      border-radius: 20px;
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 58%, #eef2f7 100%);
      border: 1px solid #c8a45d;
      box-shadow: 0 18px 45px rgba(0, 59, 112, 0.22);
      color: #003b70;
    }

    .ticket-card-admin::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      background: linear-gradient(180deg, #c8102e 0%, #c8102e 55%, #003b70 100%);
    }

    .ticket-card-admin-main {
      padding: 24px 26px 22px 30px;
    }

    .ticket-card-admin-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .ticket-card-admin-wordmark {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #c8102e;
    }

    .ticket-card-admin-wordmark span {
      color: #003b70;
    }

    .ticket-card-admin-type {
      padding: 5px 10px;
      border: 1px solid rgba(200, 164, 93, 0.55);
      border-radius: 999px;
      color: #8b6b2d;
      background: #fffaf0;
      font-size: 0.67rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .ticket-card-admin-label {
      color: #8b6b2d;
      font-size: 0.67rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .ticket-card-admin-name {
      margin-top: 7px;
      color: #003b70;
      font-size: clamp(1.55rem, 4vw, 2.25rem);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.03em;
      word-break: break-word;
    }

    .ticket-card-admin-subtitle {
      margin-top: 8px;
      color: #64748b;
      font-size: 0.78rem;
    }

    .ticket-card-admin-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 22px;
    }

    .ticket-card-admin-detail-label {
      color: #94a3b8;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .ticket-card-admin-detail-value {
      margin-top: 4px;
      color: #0f172a;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .ticket-card-admin-code {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 0.66rem;
      letter-spacing: 0.08em;
    }

    .ticket-card-admin-stub {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
      background: linear-gradient(180deg, #003b70, #071b33);
      color: #fff;
      text-align: center;
    }

    .ticket-card-admin-stub::before,
    .ticket-card-admin-stub::after {
      content: "";
      position: absolute;
      left: -11px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #0b1220;
    }

    .ticket-card-admin-stub::before {
      top: 26px;
    }

    .ticket-card-admin-stub::after {
      bottom: 26px;
    }

    .ticket-card-admin-stub-label {
      color: #c8a45d;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .ticket-card-admin-stub-title {
      color: #fff;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.14em;
    }

    .ticket-card-admin-ticket-code {
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      word-break: break-all;
    }

    .ticket-card-admin-status {
      color: #c8a45d;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .preview-button {
      padding: 6px 10px;
      background: rgba(200, 164, 93, 0.12);
      color: #e8c778;
      border: 1px solid rgba(200, 164, 93, 0.35);
      font-size: 0.75rem;
    }

    @media (max-width: 560px) {
      .container {
        padding: 20px;
      }
      .btn-danger-outline {
        margin-left: 0;
      }
      .ticket-card-admin {
        grid-template-columns: 1fr;
      }
      .ticket-card-admin-stub {
        min-height: 130px;
      }
      .ticket-card-admin-details {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .container {
        padding: 20px;
      }
      .btn-danger-outline {
        margin-left: 0;
      }
    }

    /* Keep admin preview visually identical to the public graduation card */
    .ticket-card-admin {
      display: grid !important;
      grid-template-columns: 23% minmax(0, 55%) 22% !important;

      border-radius: 18px !important;
      border: 1px solid rgba(200,164,93,.8) !important;
      background: #fff8e9 !important;
    }

    .ticket-card-admin-left,
    .ticket-card-admin-main,
    .ticket-card-admin-right {
      min-width: 0;
      position: relative;
    }

    .ticket-card-admin-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 18px;
      color: #fff;
      text-align: center;
      background: linear-gradient(155deg, #0a3557, #041d32);
      border-right: 1px solid rgba(200,164,93,.7);
    }

    .ticket-card-admin-left-brand {
      color: #f6e2ac;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .18em;
    }

    .ticket-card-admin-left-icon { font-size: 2.2rem; margin: 12px 0 4px; }
    .ticket-card-admin-left-title { font-size: .85rem; font-weight: 800; letter-spacing: .14em; line-height: 1.55; }
    .ticket-card-admin-left-script { margin-top: 16px; color: #fff; font-family: 'Segoe Script','Brush Script MT',cursive; font-size: 1.55rem; line-height: 1.05; transform: rotate(-4deg); }
    .ticket-card-admin-left-foot { color: rgba(255,255,255,.62); font-size: .48rem; letter-spacing: .2em; }

    .ticket-card-admin-main {
      padding: 25px 25px 20px 28px !important;

    }

    .ticket-card-admin-wordmark { color: #003b70; font-size: .8rem; font-weight: 900; letter-spacing: .14em; }

    .ticket-card-admin-label { color: #003b70; font-size: .58rem; font-weight: 900; letter-spacing: .22em; }

    .ticket-card-admin-name-small { display: inline-block; margin-top: 5px; color: #173957; font-family: 'Segoe Script','Brush Script MT',cursive; font-size: 1.15rem; font-weight: 600; }
    .ticket-card-admin-subtitle { margin-top: 7px; color: #315b75; font-size: .68rem; }
    .ticket-card-admin-details { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(0,59,112,.18); }
    .ticket-card-admin-detail-label { color: #8b6a2e; font-size: .5rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    .ticket-card-admin-detail-value { margin-top: 4px; color: #173957; font-size: .72rem; font-weight: 800; line-height: 1.35; }

    .ticket-card-admin-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 23px 15px 19px;
      color: #fff;
      text-align: center;
      background: linear-gradient(155deg, #073b5c, #031d30);
      border-left: 1px solid rgba(200,164,93,.65);
    }

    .ticket-card-admin-right-label { color: #f6e2ac; font-size: .48rem; font-weight: 900; letter-spacing: .13em; line-height: 1.5; }
    .ticket-card-admin-countdown { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; margin: 10px 0 13px; }
    .ticket-card-admin-countdown > div { padding: 6px 2px; border: 1px solid rgba(200,164,93,.48); border-radius: 7px; background: rgba(255,255,255,.05); }
    .ticket-card-admin-countdown b { display: block; color: #fff6d8; font-size: .75rem; }
    .ticket-card-admin-countdown small { color: rgba(255,255,255,.58); font-size: .36rem; text-transform: uppercase; }
    .ticket-card-admin-right-message { color: rgba(255,255,255,.86); font-family: 'Segoe Script','Brush Script MT',cursive; font-size: .78rem; line-height: 1.35; }
    .ticket-card-admin-right-code { padding: 9px 6px; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; background: rgba(255,255,255,.06); }
    .ticket-card-admin-right-code small { display:block; color: rgba(255,255,255,.55); font-size:.38rem; letter-spacing:.12em; }
    .ticket-card-admin-right-code strong { display:block; margin-top:4px; color:#f6e2ac; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.58rem; word-break:break-all; }
    .ticket-card-admin-status { color:#d7f9df; font-size:.5rem; font-weight:800; letter-spacing:.08em; }

    @media (max-width: 620px) {
      .ticket-card-admin { grid-template-columns: 1fr !important; }
      .ticket-card-admin-left,
      .ticket-card-admin-main,
      .ticket-card-admin-right { border: 0 !important; }
      .ticket-card-admin-left { min-height: 130px; flex-direction: row; align-items:center; padding:16px 20px; }
      .ticket-card-admin-left-icon { margin:0; font-size:1.5rem; }
      .ticket-card-admin-left-script { margin:0; font-size:1.15rem; }
      .ticket-card-admin-right { min-height:160px; }
    }

<style id="ticket-template-admin-style">
.ticket-template-card-admin{position:relative;width:100%;max-width:1100px;margin:0 auto;aspect-ratio:1536/1024;overflow:hidden;border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.45);background:#eee}
.ticket-template-image-admin{display:block;width:100%;height:100%;object-fit:cover}
.ticket-template-name-admin{position:absolute;left:24.4%;top:59.65%;width:28.3%;height:4.35%;display:flex;align-items:center;justify-content:center;padding:0 1.5%;overflow:hidden;background:#fffaf0;border:1.5px solid #c99a27;border-radius:7px;color:#164a78;font-family:Arial,sans-serif;font-size:clamp(10px,1.45vw,22px);font-weight:500;line-height:1;text-align:center;white-space:nowrap;text-overflow:ellipsis;box-shadow:0 1px 4px rgba(0,0,0,.08)}
@media(max-width:600px){.ticket-template-card-admin{border-radius:10px}.ticket-template-name-admin{border-width:1px;border-radius:4px;font-size:clamp(7px,2.15vw,14px)}}
</style>
</head>
<body>
  <div class="container" id="loginView">
    <div class="login-box">
      <h1>🔐 Admin Login</h1>
      <label class="field-label" for="adminEmail">Email admin</label>
      <input type="email" id="adminEmail" placeholder="admin@example.com" autocomplete="email" />
      <label class="field-label" for="adminPassword">Mật khẩu Supabase</label>
      <input type="password" id="adminPassword" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if (event.key === 'Enter') signInAdmin()" />
      <button type="button" class="btn-primary" onclick="signInAdmin()">Đăng nhập</button>
      <div class="status" id="loginStatus">Chỉ tài khoản admin mới xem được danh sách.</div>
    </div>
  </div>

  <div class="container hidden" id="adminView">
    <h1>Danh Sách Khách Dự <span class="badge">v4</span></h1>
    <div class="subtitle">Quản lý khách mời trong thời gian thực</div>
    <div class="status" id="status">Đang kết nối dữ liệu...</div>
    <div class="toolbar">
      <button type="button" class="btn-primary" onclick="loadGuests()">↻ Tải lại</button>
      <button type="button" class="btn-ghost" onclick="exportGuests()">⬇ Xuất file</button>
      <button type="button" class="btn-danger-outline" id="deleteAllBtn" onclick="deleteAllGuests()">🗑 Xóa tất cả</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Tên khách</th>
            <th>Lời chúc</th>
            <th>Trạng thái</th>
            <th>Thời gian</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="guestTableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="ticket-modal" id="ticketModal" onclick="if (event.target === this) closeTicketPreview()">
    <div class="ticket-modal-panel" role="dialog" aria-modal="true" aria-labelledby="ticketModalTitle">
      <div class="ticket-modal-head">
        <div class="ticket-modal-title" id="ticketModalTitle">Preview card vé</div>
        <button type="button" class="ticket-modal-close" onclick="closeTicketPreview()">✕ Đóng</button>
      </div>
      <div id="ticketPreview"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase
      ? window.supabase.createClient(
        'https://yxeatkqsikzitxqqdfvc.supabase.co',
        'sb_publishable_PrBvWZ44-iPDPAp9yu0n2A_JrQSX4to'
      )
      : null;

    function showAdminView() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('adminView').classList.remove('hidden');
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    async function signInAdmin() {
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const loginStatus = document.getElementById('loginStatus');

      if (!supabaseClient) {
        loginStatus.textContent = 'Không tải được Supabase. Hãy tải lại trang hoặc kiểm tra mạng.';
        return;
      }

      if (!email || !password) {
        loginStatus.textContent = 'Vui lòng nhập email và mật khẩu Supabase.';
        return;
      }

      loginStatus.textContent = 'Đang đăng nhập...';
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (!error) {
        showAdminView();
        loadGuests();
      } else {
        loginStatus.textContent = `Đăng nhập thất bại: ${error.message}`;
      }
    }

    async function loadGuests() {
      const status = document.getElementById('status');
      const body = document.getElementById('guestTableBody');
      const deleteAllBtn = document.getElementById('deleteAllBtn');

      try {
        const { data: sessionData } = await supabaseClient.auth.getSession();
        const user = sessionData.session?.user;
        if (!user) {
          throw new Error('Phiên đăng nhập không còn hiệu lực. Hãy đăng nhập lại.');
        }

        const { data, error } = await supabaseClient
          .from('guests')
          .select('*')
          .order('created_at', { ascending: true });

        if (error) throw error;

        if (!data || !data.length) {
          body.innerHTML = '<tr><td colspan="6" class="empty">Chưa có khách nào được lưu.</td></tr>';
          status.textContent = `Đã đăng nhập ${user.email}, nhưng database đang rỗng`;
          deleteAllBtn.disabled = true;
          return;
        }

        deleteAllBtn.disabled = false;
        window.adminGuestData = data;
        body.innerHTML = data.map((guest, index) => `
          <tr>
            <td>${index + 1}</td>
            <td>${escapeHtml(guest.name)}</td>
            <td style="max-width:320px; white-space:pre-wrap; line-height:1.45;">${escapeHtml(guest.wish || '—')}</td>
            <td><span class="status-pill">${escapeHtml(guest.status || 'confirmed')}</span></td>
            <td>${new Date(guest.created_at).toLocaleString('vi-VN')}</td>
            <td>
              <button class="preview-button" type="button" onclick="openTicketPreviewByIndex(${index})">🎟️ Card</button>
              <button class="delete-button" type="button" onclick="deleteGuest('${guest.id}')">Xóa</button>
            </td>
          </tr>
        `).join('');

        status.textContent = `Đã đăng nhập ${user.email} · Đã tải ${data.length} khách`;
      } catch (err) {
        console.error(err);
        status.textContent = `Không đọc được database: ${err.message}`;
        body.innerHTML = '<tr><td colspan="6" class="empty">Lỗi tải dữ liệu.</td></tr>';
      }
    }

    function openTicketPreviewByIndex(index) {
      const guest = window.adminGuestData?.[index];
      if (!guest) return;
      openTicketPreview(guest);
    }

    function openTicketPreview(guest) {
      const modal = document.getElementById('ticketModal');
      const preview = document.getElementById('ticketPreview');
      const name = escapeHtml(guest?.name || 'Khách mời');

      preview.innerHTML =
        '<article class="ticket-template-card-admin">' +
          '<img class="ticket-template-image-admin" src="assets/Card.png" alt="HUTECH Graduation Ticket">' +
          '<div class="ticket-template-name-admin">' + name + '</div>' +
        '</article>';

      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeTicketPreview() {
      document.getElementById('ticketModal').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeTicketPreview();
    });

    (async function restoreAdminSession() {
      if (!supabaseClient) return;
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) {
        showAdminView();
        loadGuests();
      }
    })();

    async function exportGuests() {
      const { data, error } = await supabaseClient
        .from('guests')
        .select('name, wish, status, created_at')
        .order('created_at', { ascending: true });

      if (error) {
        document.getElementById('status').textContent = 'Không thể xuất file: lỗi kết nối database.';
        return;
      }

      if (!data || !data.length) {
        document.getElementById('status').textContent = 'Chưa có khách để xuất file.';
        return;
      }

      const header = 'STT,Tên khách,Lời chúc,Trạng thái,Thời gian';
      const rows = data.map((guest, index) => [
        index + 1,
        guest.name,
        guest.wish || '',
        guest.status || 'confirmed',
        new Date(guest.created_at).toLocaleString('vi-VN')
      ].map(value => `"${String(value).replace(/"/g, '""')}"`).join(','));
      const blob = new Blob(['\ufeff' + [header, ...rows].join('\n')], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = 'danh-sach-khach-du.csv';
      anchor.click();
      URL.revokeObjectURL(url);
      document.getElementById('status').textContent = `Đã xuất ${data.length} khách ra file CSV`;
    }

    async function deleteGuest(id) {
      if (!window.confirm('Bạn có chắc muốn xóa khách này không?')) return;

      const { error } = await supabaseClient
        .from('guests')
        .delete()
        .eq('id', id);

      if (error) {
        document.getElementById('status').textContent = `Xóa thất bại: ${error.message}`;
        return;
      }

      document.getElementById('status').textContent = 'Đã xóa khách khỏi database.';
      loadGuests();
    }

    async function deleteAllGuests() {
      const status = document.getElementById('status');
      const deleteAllBtn = document.getElementById('deleteAllBtn');

      const { data, error: countError } = await supabaseClient
        .from('guests')
        .select('id');

      if (countError) {
        status.textContent = `Không thể kiểm tra dữ liệu: ${countError.message}`;
        return;
      }

      const total = data ? data.length : 0;
      if (!total) {
        status.textContent = 'Không có khách nào để xóa.';
        return;
      }

      const confirmed = window.confirm(
        `Bạn có chắc muốn xóa TẤT CẢ ${total} khách? Hành động này không thể hoàn tác.`
      );
      if (!confirmed) return;

      deleteAllBtn.disabled = true;
      status.textContent = `Đang xóa ${total} khách...`;

      const { error } = await supabaseClient
        .from('guests')
        .delete()
        .not('id', 'is', null);

      if (error) {
        status.textContent = `Xóa tất cả thất bại: ${error.message}`;
        deleteAllBtn.disabled = false;
        return;
      }

      status.textContent = `Đã xóa toàn bộ ${total} khách khỏi database.`;
      loadGuests();
    }
  </script>
</body>
</html>
