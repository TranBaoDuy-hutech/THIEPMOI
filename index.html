<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp Mời Tốt Nghiệp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030711;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background */
    .bg-canvas {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(34,211,238,0.12), transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(52,211,153,0.08), transparent 60%),
        linear-gradient(rgba(34,211,238,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,0.03) 1px, transparent 1px);
      background-size: 100%, 100%, 28px 28px, 28px 28px;
      animation: bgPulse 8s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      0%   { opacity: 0.7; }
      100% { opacity: 1; }
    }

    /* Floating particles */
    .particles {
      position: fixed; inset: 0; z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      background: #22d3ee;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
      box-shadow: 0 0 8px #22d3ee;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-20vh) scale(1); opacity: 0; }
    }

    /* Content */
    .content {
      text-align: center;
      z-index: 1;
      padding: 2rem;
      max-width: 480px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-size: 3.4rem;
      margin-bottom: 1.2rem;
      display: inline-block;
      filter: drop-shadow(0 0 16px rgba(34,211,238,0.7));
      animation: logoFloat 3.5s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-10px) rotate(2deg); }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.9rem, 6.5vw, 2.5rem);
      font-weight: 700;
      margin-bottom: 0.6rem;
      background: linear-gradient(135deg, #ffffff 30%, #22d3ee 70%, #34d399);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    p.sub {
      color: #94a3b8;
      font-size: 0.98rem;
      margin-bottom: 2.8rem;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
    }

    /* Button */
    .open-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #22d3ee, #34d399);
      color: #04141a;
      border: none;
      padding: 17px 40px;
      border-radius: 50px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.35s ease;
      box-shadow: 0 0 28px rgba(34,211,238,0.45),
                  0 8px 24px rgba(0,0,0,0.3);
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.75s forwards;
    }

    /* Shine sweep */
    .open-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.45),
        transparent
      );
      transform: skewX(-20deg);
      transition: left 0.6s ease;
    }
    .open-btn:hover::before {
      left: 140%;
    }

    .open-btn:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 0 42px rgba(34,211,238,0.75),
                  0 12px 32px rgba(0,0,0,0.35);
    }
    .open-btn:active {
      transform: translateY(-1px) scale(0.98);
    }

    .open-btn svg {
      width: 20px; height: 20px;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .open-btn:hover svg {
      transform: translateX(4px);
    }

    /* Ripple on click */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transform: scale(0);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }
    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    .hint {
      margin-top: 2.2rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #5b6b85;
      letter-spacing: 0.12em;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
    }

    /* Soft glow ring behind button */
    .btn-wrap {
      position: relative;
      display: inline-block;
    }
    .btn-wrap::after {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 60px;
      background: radial-gradient(circle, rgba(34,211,238,0.25), transparent 70%);
      z-index: -1;
      opacity: 0;
      transition: opacity 0.4s ease;
      animation: pulseGlow 2.8s ease-in-out infinite;
    }
    .btn-wrap:hover::after {
      opacity: 1;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50%      { transform: scale(1.15); opacity: 0.7; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .logo, h1, .bg-canvas, .btn-wrap::after,
      .particle, .open-btn, .content, p.sub, .hint {
        animation: none !important;
      }
      .content, p.sub, .open-btn, .hint {
        opacity: 1; transform: none;
      }
      .open-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="bg-canvas"></div>
  <div class="particles" id="particles"></div>

  <div class="content">
    <div class="logo">🎓</div>
    <h1>Thiệp Mời Tốt Nghiệp</h1>
    <p class="sub">
      Lễ tốt nghiệp Kỹ sư CNTT — Trần Bảo Duy<br>
      HUTECH University, ngày 10/2026
    </p>

    <div class="btn-wrap">
      <button class="open-btn" id="openBtn" onclick="openInvitation(event)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Mở Thiệp
      </button>
    </div>

    <p class="hint">// tap to open invitation &amp; start music</p>
  </div>

  <script>
    // Particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (6 + Math.random() * 10) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
      container.appendChild(p);
    }

    // Ripple effect
    function createRipple(e) {
      const btn = e.currentTarget;
      const circle = document.createElement('span');
      const diameter = Math.max(btn.clientWidth, btn.clientHeight);
      const radius = diameter / 2;
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${e.clientX - btn.getBoundingClientRect().left - radius}px`;
      circle.style.top = `${e.clientY - btn.getBoundingClientRect().top - radius}px`;
      circle.classList.add('ripple');
      const ripple = btn.getElementsByClassName('ripple')[0];
      if (ripple) ripple.remove();
      btn.appendChild(circle);
    }

    function openInvitation(e) {
      createRipple(e);
      // Giữ user activation → autoplay nhạc ở index.html
      setTimeout(() => {
        window.location.href = 'thiep.html';
      }, 280);
    }

    // Keyboard support
    document.getElementById('openBtn').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openInvitation(e);
      }
    });
  </script>
</body>
</html>
