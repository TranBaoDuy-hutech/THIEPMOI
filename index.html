<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp Mời Tốt Nghiệp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #030711;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Custom cursor - chỉ desktop */
    .cursor,
    .cursor-follower {
      display: none;
      pointer-events: none !important;
    }

    @media (hover: hover) and (pointer: fine) {
      body {
        cursor: none;
      }

      .cursor,
      .cursor-follower {
        display: block;
      }
    }

    .cursor {
      position: fixed;
      width: 12px;
      height: 12px;
      background: #22d3ee;
      border-radius: 50%;
      z-index: 9999;
      mix-blend-mode: difference;
      transition: width 0.2s, height 0.2s;
      box-shadow: 0 0 20px #22d3ee, 0 0 40px rgba(34, 211, 238, 0.4);
      transform: translate(-50%, -50%);
    }

    .cursor-follower {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 1.5px solid rgba(34, 211, 238, 0.5);
      border-radius: 50%;
      z-index: 9998;
      transition: transform 0.15s ease-out;
      transform: translate(-50%, -50%);
    }

    /* Background layers */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(ellipse 90% 70% at 50% 30%, rgba(34, 211, 238, 0.15), transparent 65%),
        radial-gradient(ellipse 70% 50% at 80% 80%, rgba(52, 211, 153, 0.1), transparent 55%),
        radial-gradient(ellipse 50% 40% at 15% 70%, rgba(167, 139, 250, 0.08), transparent 50%),
        linear-gradient(rgba(34, 211, 238, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.025) 1px, transparent 1px);
      background-size: 100%, 100%, 100%, 32px 32px, 32px 32px;
      animation: bgPulse 10s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% {
        opacity: 0.65;
        filter: hue-rotate(0deg);
      }

      100% {
        opacity: 1;
        filter: hue-rotate(15deg);
      }
    }

    .aurora {
      position: fixed;
      inset: -50%;
      z-index: -2;
      background:
        radial-gradient(ellipse 40% 30% at 30% 40%, rgba(34, 211, 238, 0.18), transparent),
        radial-gradient(ellipse 35% 25% at 70% 60%, rgba(52, 211, 153, 0.12), transparent),
        radial-gradient(ellipse 30% 20% at 50% 80%, rgba(167, 139, 250, 0.1), transparent);
      animation: auroraMove 18s ease-in-out infinite alternate;
      filter: blur(60px);
      opacity: 0.8;
    }

    @keyframes auroraMove {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }

      50% {
        transform: translate(-5%, 3%) rotate(3deg) scale(1.05);
      }

      100% {
        transform: translate(4%, -2%) rotate(-2deg) scale(1.02);
      }
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.03) 2px,
          rgba(0, 0, 0, 0.03) 4px);
      pointer-events: none;
      opacity: 0.4;
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
      box-shadow: 0 0 12px currentColor;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0) rotate(0deg);
        opacity: 0;
      }

      8% {
        opacity: 0.9;
      }

      90% {
        opacity: 0.3;
      }

      100% {
        transform: translateY(-30vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    .content {
      text-align: center;
      z-index: 1;
      padding: 2rem;
      max-width: 520px;
      opacity: 0;
      transform: translateY(40px) scale(0.96);
      animation: fadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 1.4rem;
    }

    .logo {
      font-size: 4rem;
      display: inline-block;
      filter: drop-shadow(0 0 20px rgba(34, 211, 238, 0.8));
      animation: logoFloat 4s ease-in-out infinite;
      transform-origin: center;
      position: relative;
      z-index: 2;
    }

    @keyframes logoFloat {

      0%,
      100% {
        transform: translateY(0) rotate(-3deg) scale(1);
      }

      50% {
        transform: translateY(-14px) rotate(3deg) scale(1.05);
      }
    }

    .logo-ring {
      position: absolute;
      inset: -18px;
      border: 1.5px solid rgba(34, 211, 238, 0.35);
      border-radius: 50%;
      animation: ringPulse 3s ease-in-out infinite;
    }

    .logo-ring:nth-child(2) {
      inset: -32px;
      border-color: rgba(52, 211, 153, 0.2);
      animation-delay: 0.6s;
      animation-duration: 4s;
    }

    @keyframes ringPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.6;
      }

      50% {
        transform: scale(1.12);
        opacity: 1;
      }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 7vw, 2.8rem);
      font-weight: 700;
      margin-bottom: 0.7rem;
      background: linear-gradient(110deg,
          #ffffff 20%,
          #22d3ee 40%,
          #34d399 60%,
          #a78bfa 80%,
          #ffffff 100%);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 5s linear infinite;
      letter-spacing: -0.02em;
      text-shadow: 0 0 40px rgba(34, 211, 238, 0.3);
    }

    @keyframes shimmer {
      0% {
        background-position: 0% center;
      }

      100% {
        background-position: 300% center;
      }
    }

    .holo-line {
      width: 0;
      height: 2px;
      margin: 0.4rem auto 1.6rem;
      background: linear-gradient(90deg, transparent, #22d3ee, #34d399, transparent);
      border-radius: 2px;
      animation: lineExpand 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.9s forwards;
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.6);
    }

    @keyframes lineExpand {
      to {
        width: 180px;
      }
    }

    p.sub {
      color: #94a3b8;
      font-size: 1.02rem;
      margin-bottom: 2.8rem;
      line-height: 1.75;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards;
    }

    p.sub span {
      color: #22d3ee;
      font-weight: 500;
    }

    .btn-wrap {
      position: relative;
      display: inline-block;
    }

    .btn-wrap::before {
      content: '';
      position: absolute;
      inset: -18px;
      border-radius: 70px;
      background: conic-gradient(from 0deg,
          transparent,
          rgba(34, 211, 238, 0.4),
          transparent 30%,
          transparent 70%,
          rgba(52, 211, 153, 0.35),
          transparent);
      animation: spin 4s linear infinite;
      opacity: 0.7;
      z-index: -1;
      filter: blur(8px);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .btn-wrap::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 60px;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.3), transparent 70%);
      z-index: -1;
      animation: pulseGlow 2.5s ease-in-out infinite;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.2);
        opacity: 0.85;
      }
    }

    .open-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(135deg, #22d3ee 0%, #34d399 50%, #22d3ee 100%);
      background-size: 200% auto;
      color: #04141a;
      border: none;
      padding: 18px 44px;
      border-radius: 50px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.4s ease,
        background-position 0.6s ease;
      box-shadow:
        0 0 30px rgba(34, 211, 238, 0.5),
        0 8px 28px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
    }

    .open-btn:hover {
      transform: translateY(-6px) scale(1.04);
      background-position: 100% center;
      box-shadow:
        0 0 50px rgba(34, 211, 238, 0.8),
        0 14px 36px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .open-btn:active {
      transform: translateY(-2px) scale(0.98);
    }

    .open-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: linear-gradient(90deg,
          transparent,
          rgba(255, 255, 255, 0.55),
          transparent);
      transform: skewX(-25deg);
      transition: left 0.7s ease;
    }

    .open-btn:hover::before {
      left: 140%;
    }

    .open-btn svg {
      width: 22px;
      height: 22px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .open-btn:hover svg {
      transform: translateX(6px);
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      transform: scale(0);
      animation: ripple 0.7s linear;
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: scale(4.5);
        opacity: 0;
      }
    }

    .hint {
      margin-top: 2.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: #5b6b85;
      letter-spacing: 0.15em;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 1.3s forwards;
    }

    .hint span {
      color: #22d3ee;
      animation: blink 1.4s step-end infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none !important;
    }

    @media (prefers-reduced-motion: reduce) {

      .logo,
      h1,
      .bg-canvas,
      .aurora,
      .btn-wrap::before,
      .btn-wrap::after,
      .particle,
      .open-btn,
      .content,
      p.sub,
      .hint,
      .logo-ring,
      .holo-line {
        animation: none !important;
      }

      .content,
      p.sub,
      .open-btn,
      .hint {
        opacity: 1;
        transform: none;
      }

      .open-btn {
        transition: none;
      }

      .cursor,
      .cursor-follower {
        display: none !important;
      }

      body {
        cursor: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="bg-canvas"></div>
  <div class="aurora"></div>
  <div class="scanlines"></div>
  <div class="particles" id="particles"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <div class="content">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-ring"></div>
      <div class="logo">🎓</div>
    </div>

    <h1>Thiệp Mời Tốt Nghiệp</h1>
    <div class="holo-line"></div>

    <p class="sub">
      Lễ tốt nghiệp Kỹ sư <span>CNTT</span> — Trần Bảo Duy<br>
      HUTECH University, <span>10/2026</span>
    </p>

    <div class="btn-wrap">
      <button class="open-btn" id="openBtn" onclick="openInvitation(event)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Mở Thiệp
      </button>
    </div>

    <p class="hint">// tap to open invitation &amp; start music <span>_</span></p>
  </div>

  <script>
    // ========== Custom Cursor (chỉ desktop) ==========
    const isFinePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    const cursor = document.getElementById('cursor');
    const follower = document.getElementById('cursorFollower');

    if (isFinePointer) {
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let followerX = mouseX;
      let followerY = mouseY;

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        cursor.style.left = mouseX + 'px';
        cursor.style.top = mouseY + 'px';
      });

      function animateFollower() {
        followerX += (mouseX - followerX) * 0.15;
        followerY += (mouseY - followerY) * 0.15;
        follower.style.left = followerX + 'px';
        follower.style.top = followerY + 'px';
        requestAnimationFrame(animateFollower);
      }
      animateFollower();

      const btn = document.getElementById('openBtn');
      btn.addEventListener('mouseenter', () => {
        cursor.style.width = '28px';
        cursor.style.height = '28px';
      });
      btn.addEventListener('mouseleave', () => {
        cursor.style.width = '12px';
        cursor.style.height = '12px';
      });
    }

    // ========== Particles ==========
    const container = document.getElementById('particles');
    const colors = ['#22d3ee', '#34d399', '#a78bfa', '#67e8f9', '#6ee7b7'];
    for (let i = 0; i < 42; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (7 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      const size = 2 + Math.random() * 5;
      p.style.width = p.style.height = size + 'px';
      p.style.color = colors[Math.floor(Math.random() * colors.length)];
      p.style.background = p.style.color;
      container.appendChild(p);
    }

    // ========== Confetti ==========
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confetti = [];
    let confettiActive = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function createConfetti() {
      confetti = [];
      const colors = ['#22d3ee', '#34d399', '#a78bfa', '#f472b6', '#fbbf24', '#ffffff'];
      for (let i = 0; i < 140; i++) {
        confetti.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 80,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 18,
          vy: Math.random() * -14 - 6,
          size: Math.random() * 8 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 12,
          gravity: 0.28 + Math.random() * 0.12,
          life: 1,
          decay: 0.008 + Math.random() * 0.006
        });
      }
      confettiActive = true;
      requestAnimationFrame(updateConfetti);
    }

    function updateConfetti() {
      if (!confettiActive) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;

      confetti.forEach(p => {
        if (p.life <= 0) return;
        alive = true;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotSpeed;
        p.life -= p.decay;
        p.vx *= 0.99;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });

      if (alive) {
        requestAnimationFrame(updateConfetti);
      } else {
        confettiActive = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    // ========== Ripple + Open ==========
    function createRipple(e) {
      const btn = e.currentTarget;
      const circle = document.createElement('span');
      const diameter = Math.max(btn.clientWidth, btn.clientHeight);
      const radius = diameter / 2;
      const rect = btn.getBoundingClientRect();
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${(e.clientX || rect.left + rect.width / 2) - rect.left - radius}px`;
      circle.style.top = `${(e.clientY || rect.top + rect.height / 2) - rect.top - radius}px`;
      circle.classList.add('ripple');
      const old = btn.getElementsByClassName('ripple')[0];
      if (old) old.remove();
      btn.appendChild(circle);
    }

    function openInvitation(e) {
      createRipple(e);
      createConfetti();

      const content = document.querySelector('.content');
      content.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
      content.style.transform = 'scale(0.96)';
      content.style.opacity = '0.7';

      setTimeout(() => {
        window.location.href = 'thiep.html';
      }, 650);
    }

    document.getElementById('openBtn').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openInvitation(e);
      }
    });
  </script>
</body>

</html>
